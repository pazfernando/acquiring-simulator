spring.application.name=acquiring-simulator
# Local in-process exercise only: no HTTP listener or UI in this slice.
spring.main.web-application-type=none
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/schema.sql
spring.datasource.hikari.maximum-pool-size=4

# Approved simulator defaults (HD-02 / R17 / R20), adjustable by the owner.
simulator.authorization.duplicate-window=PT24H
simulator.authorization.response-timeout=PT30S

# Approved profile fixtures (HD-01 / P01-P03), synthetic identifiers only.
simulator.profile.acquirers[0].reference=ACQ-SIM-001
simulator.profile.acquirers[0].routes=DOMESTIC,INTERNATIONAL
simulator.profile.acquirers[1].reference=ACQ-SIM-INTL
simulator.profile.acquirers[1].routes=INTERNATIONAL

simulator.profile.merchants[0].reference=MERCH-SIM-001
simulator.profile.merchants[0].acquirer=ACQ-SIM-001
simulator.profile.merchants[1].reference=MERCH-SIM-002
simulator.profile.merchants[1].acquirer=ACQ-SIM-INTL
simulator.profile.merchants[2].reference=MERCH-SIM-003
simulator.profile.merchants[2].acquirer=ACQ-SIM-001

simulator.profile.terminals[0].reference=TERM-SIM-001
simulator.profile.terminals[0].merchant=MERCH-SIM-001
simulator.profile.terminals[1].reference=TERM-SIM-002
simulator.profile.terminals[1].merchant=MERCH-SIM-002
simulator.profile.terminals[2].reference=TERM-SIM-003
simulator.profile.terminals[2].merchant=MERCH-SIM-003

simulator.profile.credential-ranges[0].prefix=SIM-APP-
simulator.profile.credential-ranges[0].decision=APPROVE
simulator.profile.credential-ranges[0].route=DOMESTIC
simulator.profile.credential-ranges[1].prefix=SIM-DEC-
simulator.profile.credential-ranges[1].decision=DECLINE
simulator.profile.credential-ranges[1].route=DOMESTIC
simulator.profile.credential-ranges[2].prefix=SIM-TMO-
simulator.profile.credential-ranges[2].decision=TIMEOUT
simulator.profile.credential-ranges[2].route=DOMESTIC
